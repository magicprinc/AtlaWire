name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates and offline suite
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project and its test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests checks tools

      - name: Format
        run: python -m ruff format --check src tests checks tools

      - name: Types
        run: python -m pyright src

      - name: Frozen REST inventory
        run: python -B tools/build_rest_inventory.py --check
        env:
          PYTHONPATH: src

      - name: Read manifest projection
        run: python -B tools/build_read_manifest.py --check

      - name: API surface documents
        run: python -B tools/build_api_surface_docs.py --check

      - name: Documented query parameters
        run: python -B tools/build_query_surface.py --check

      - name: Administrative read surface
        run: python -B tools/build_admin_surface.py --check

      - name: Read-only guarantee
        run: python -B tools/check_read_only.py
        env:
          PYTHONPATH: src

      - name: Registry against the servers' own API surface
        run: python -B tools/check_api_surface.py --check
        env:
          PYTHONPATH: src

      - name: Offline suite
        run: python -B -m pytest -q -p no:cacheprovider tests

      - name: Dependency audit
        run: python -m pip_audit --local
